name: Integration

permissions:
  contents: read
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_LOG: debug
  WAYLAND_DEBUG: 1
  REIS_DEBUG: 1

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        rust:
          - stable
          - nightly
          - "1.93.1"
        platform:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        features:
         # - "libei,tokio,wayland,xdo,x11rb,xdg_desktop"
         # - "libei,smol,wayland,xdo,x11rb,xdg_desktop"
          - "default"
         # - "libei,tokio"
         # - "libei,smol"
         # - "wayland"
          - "xdo"
          - "x11rb"
         # - "xdg_desktop,tokio"
         # - "xdg_desktop,smol"
        exclude:
         # - platform: windows-latest
         #   features: "libei,tokio,wayland,xdo,x11rb,xdg_desktop"
         # - platform: windows-latest
         #   features: "libei,smol,wayland,xdo,x11rb,xdg_desktop"
         # - platform: windows-latest
         #   features: "libei,tokio"
         # - platform: windows-latest
         #   features: "libei,smol"
         # - platform: windows-latest
         #   features: "wayland"
          - platform: windows-latest
            features: "xdo"
          - platform: windows-latest
            features: "x11rb"
          #- platform: windows-latest
          #  features: "xdg_desktop,tokio"
          #- platform: windows-latest
          #  features: "xdg_desktop,smol"
         # - platform: macos-latest
         #   features: "libei,tokio,wayland,xdo,x11rb,xdg_desktop"
         # - platform: macos-latest
         #   features: "libei,smol,wayland,xdo,x11rb,xdg_desktop"
         # - platform: macos-latest
         #   features: "libei,tokio"
         # - platform: macos-latest
         #   features: "libei,smol"
         # - platform: macos-latest
         #   features: "wayland"
          - platform: macos-latest
            features: "xdo"
          - platform: macos-latest
            features: "x11rb"
          #- platform: macos-latest
          #  features: "xdg_desktop,tokio"
          #- platform: macos-latest
          #  features: "xdg_desktop,smol"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/install_deps

      # Ubuntu's libxdo (3.20160805) adds Alt to F1-F12 with xkeyboard-config
      # 2.46 and later (jordansissel/xdotool#491). Test against the fixed release;
      # xdotool main at 5c27b117 sends Alt+F1 again, so check before bumping.
      - name: Build the fixed libxdo on Linux
        if: runner.os == 'Linux' && matrix.features == 'xdo'
        run: |
          sudo apt-get remove -y libxdo-dev
          sudo apt-get install -y libxinerama-dev
          git clone --quiet --depth 1 --branch v4.20260303.1 https://github.com/jordansissel/xdotool "$RUNNER_TEMP/xdotool"
          test "$(git -C "$RUNNER_TEMP/xdotool" rev-parse HEAD)" = d37c16111dbe38ea29194f20ac9de03cff8dfc1c
          make -C "$RUNNER_TEMP/xdotool" libxdo.so
          sudo make -C "$RUNNER_TEMP/xdotool" installlib
          sudo ldconfig
          echo "LIBRARY_PATH=/usr/local/lib" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Setup headless display for tests on Linux
        if: runner.os == 'Linux' # This step is only needed on Linux. The other OSs don't need to be set up
        uses: $/.github/actions/headless_display

      # Firefox only hides its toolbars in kiosk mode once the window is
      # fullscreen, and on X11 a window manager has to grant that.
      - name: Start a window manager on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y openbox
          # Keep the window manager log for the `ci-logs/` artifact on failure.
          mkdir -p ci-logs
          openbox > ci-logs/openbox.log 2>&1 &

      - name: Install Firefox on macOS
        if: runner.os == 'macOS'
        run: |
          brew install --cask firefox
          # The runner image already has Firefox from Homebrew, still
          # quarantined, so Gatekeeper holds the first launch at a dialog.
          xattr -dr com.apple.quarantine /Applications/Firefox.app

          # The test clicks Control, which macOS reads as the Dictation shortcut and
          # answers with an "Enable Dictation?" dialog that takes the keyboard focus.
          defaults write com.apple.HIToolbox AppleDictationAutoEnable -int 0

      - name: Run integration tests in release mode
        if: matrix.features != 'wayland' && matrix.features != 'libei,tokio' && matrix.features != 'libei,smol' && matrix.features != 'libei,tokio,wayland,xdo,x11rb'&& matrix.features != 'libei,smol,wayland,xdo,x11rb' # On Linux, the integration tests only work with X11 for now
        run: cargo test integration --release --no-default-features --features ${{ matrix.features }},serde -- --nocapture --include-ignored

      - name: Take screenshot
        if: always()
        id: screenshot
        uses: $/.github/actions/screenshot
        with:
          platform: ${{ matrix.platform }}
          rust: ${{ matrix.rust }}
          feature: ${{ matrix.features }}

      - name: Upload screenshot
        if: always() && steps.screenshot.outcome == 'success'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: '${{ matrix.platform }}_${{ matrix.rust }}_${{ matrix.features }}.jpg'
          path: '${{ matrix.platform }}_${{ matrix.rust }}_${{ matrix.features }}.jpg'
          overwrite: true
      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: logs-${{ matrix.platform }}-${{ matrix.rust }}-${{ matrix.features }}
          path: ci-logs/
          if-no-files-found: ignore
