name: Integration

permissions:
  contents: read
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_LOG: debug
  WAYLAND_DEBUG: 1
  REIS_DEBUG: 1

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        rust:
          - stable
          - nightly
          - "1.87.0"
        platform:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        features:
         # - "libei,tokio,wayland,xdo,x11rb,xdg_desktop"
         # - "libei,smol,wayland,xdo,x11rb,xdg_desktop"
          - "default"
         # - "libei,tokio"
         # - "libei,smol"
         # - "wayland"
          - "xdo"
          - "x11rb"
         # - "xdg_desktop,tokio"
         # - "xdg_desktop,smol"
        exclude:
         # - platform: windows-latest
         #   features: "libei,tokio,wayland,xdo,x11rb,xdg_desktop"
         # - platform: windows-latest
         #   features: "libei,smol,wayland,xdo,x11rb,xdg_desktop"
         # - platform: windows-latest
         #   features: "libei,tokio"
         # - platform: windows-latest
         #   features: "libei,smol"
         # - platform: windows-latest
         #   features: "wayland"
          - platform: windows-latest
            features: "xdo"
          - platform: windows-latest
            features: "x11rb"
          #- platform: windows-latest
          #  features: "xdg_desktop,tokio"
          #- platform: windows-latest
          #  features: "xdg_desktop,smol"
         # - platform: macos-latest
         #   features: "libei,tokio,wayland,xdo,x11rb,xdg_desktop"
         # - platform: macos-latest
         #   features: "libei,smol,wayland,xdo,x11rb,xdg_desktop"
         # - platform: macos-latest
         #   features: "libei,tokio"
         # - platform: macos-latest
         #   features: "libei,smol"
         # - platform: macos-latest
         #   features: "wayland"
          - platform: macos-latest
            features: "xdo"
          - platform: macos-latest
            features: "x11rb"
          #- platform: macos-latest
          #  features: "xdg_desktop,tokio"
          #- platform: macos-latest
          #  features: "xdg_desktop,smol"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install_deps
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master branch
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Setup headless display for tests on Linux
        if: runner.os == 'Linux' # This step is only needed on Linux. The other OSs don't need to be set up
        uses: ./.github/actions/headless_display

      - name: Install Firefox on macOS
        if: runner.os == 'macOS'
        run: brew install --cask firefox

      - name: Run integration tests in release mode
        if: matrix.features != 'wayland' && matrix.features != 'libei,tokio' && matrix.features != 'libei,smol' && matrix.features != 'libei,tokio,wayland,xdo,x11rb'&& matrix.features != 'libei,smol,wayland,xdo,x11rb' # On Linux, the integration tests only work with X11 for now
        run: cargo test integration --release --no-default-features --features ${{ matrix.features }},serde -- --test-threads=1 --nocapture --include-ignored

      - name: Take screenshot
        if: always()
        uses: ./.github/actions/screenshot
        with:
          platform: ${{ matrix.platform }}
          rust: ${{ matrix.rust }}
          feature: ${{ matrix.features }}
