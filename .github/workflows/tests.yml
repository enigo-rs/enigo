name: Test

permissions:
  contents: read
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_LOG: debug
  WAYLAND_DEBUG: 1
  REIS_DEBUG: 1

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        rust:
          - stable
          - nightly
          - "1.93.1"
        platform:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        features:
          # libei, wayland and xdg_desktop need a real compositor or portal, so
          # they run in .github/workflows/linux_sessions.yml instead.
          #- "libei,tokio,wayland,xdo,x11rb,xdg_desktop"
          #- "libei,smol,wayland,xdo,x11rb,xdg_desktop"
          - "default"
          #- "libei,tokio"
          #- "libei,smol"
          #- "wayland"
          - "xdo"
          - "x11rb"
          #- "xdg_desktop,tokio"
          #- "xdg_desktop,smol"
        exclude:
          # The implementation on Windows and macOS does not have any features so we can reduce the number of combinations
          #- platform: windows-latest
          #  features: "libei,tokio,wayland,xdo,x11rb,xdg_desktop"
          #- platform: windows-latest
          #  features: "libei,smol,wayland,xdo,x11rb,xdg_desktop"
          #- platform: windows-latest
          #  features: "libei,tokio"
          #- platform: windows-latest
          #  features: "libei,smol"
          #- platform: windows-latest
          #  features: "wayland"
          - platform: windows-latest
            features: "xdo"
          - platform: windows-latest
            features: "x11rb"
          #- platform: windows-latest
          #  features: "xdg_desktop,tokio"
          #- platform: windows-latest
          #  features: "xdg_desktop,smol"
          #- platform: macos-latest
          #  features: "libei,tokio,wayland,xdo,x11rb,xdg_desktop"
          #- platform: macos-latest
          #  features: "libei,smol,wayland,xdo,x11rb,xdg_desktop"
          #- platform: macos-latest
          #  features: "libei,tokio"
          #- platform: macos-latest
          #  features: "libei,smol"
          #- platform: macos-latest
          #  features: "wayland"
          - platform: macos-latest
            features: "xdo"
          - platform: macos-latest
            features: "x11rb"
          #- platform: macos-latest
          #  features: "xdg_desktop,tokio"
          #- platform: macos-latest
          #  features: "xdg_desktop,smol"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install_deps
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master branch
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Setup headless display for tests on Linux
        if: runner.os == 'Linux' # This step is only needed on Linux. The other OSs don't need to be set up
        uses: ./.github/actions/headless_display

      - name: Install Firefox on macOS
        if: runner.os == 'macOS'
        run: brew install --cask firefox

      - name: Run the unit tests
        run: cargo test --lib --no-default-features --features ${{ matrix.features }} -- --nocapture

      - name: Run the unit tests in release mode
        run: cargo test --lib --release --no-default-features --features ${{ matrix.features }} -- --nocapture

      # The portal backends need a compositor or portal, but these regression
      # tests do not. Run them here so they do not depend on a session job.
      - name: Run the portal regression tests
        if: runner.os == 'Linux'
        run: |
          cargo test --lib --no-default-features --features xdg_desktop,tokio portal::tests -- --nocapture
          cargo test --lib --no-default-features --features xdg_desktop,tokio xdg_desktop::tests -- --nocapture

      - name: Run the sync example
        run: cargo run --example sync --no-default-features --features ${{ matrix.features }}
