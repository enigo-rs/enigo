version: 2
updates:

  # Maintain dependencies for GitHub Actions. Dependabot also regenerates the
  # matching entries in .github/workflows/actions.lock in the same pull request.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  # Maintain dependencies for cargo
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"

  # Maintain the tools used by the workflows (the devcontainers CLI)
  - package-ecosystem: "npm"
    directory: "/.github"
    schedule:
      interval: "daily"
